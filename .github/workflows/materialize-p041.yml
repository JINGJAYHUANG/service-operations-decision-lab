name: Materialize P041 service operations lab

on:
  push:
    branches:
      - feat/p041-integrated-service-ops-v1
    paths:
      - .bootstrap/**
      - .github/workflows/materialize-p041.yml

permissions:
  contents: write

concurrency:
  group: service-operations-p041-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: src

    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p041-integrated-service-ops-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: ""

      - name: Generate complete public project
        shell: bash
        run: |
          set -euo pipefail
          python .bootstrap/01_core.py
          python .bootstrap/02_engine.py
          python .bootstrap/03_docs.py
          python .bootstrap/04_tests.py
          python .bootstrap/05_finalize.py

      - name: Generate full deterministic decision artifacts
        run: python tools/generate_examples.py

      - name: Run complete release gate
        run: python tools/release_check.py

      - name: Package verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .github/workflows/materialize-p041.yml
          tar --exclude=.git -czf /tmp/service-operations-decision-lab-v0.1-source.tar.gz .
          sha256sum /tmp/service-operations-decision-lab-v0.1-source.tar.gz

      - name: Upload verified source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-operations-decision-lab-v0.1-source
          path: /tmp/service-operations-decision-lab-v0.1-source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Commit clean verified project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated project changes to commit."
            exit 0
          fi
          git commit -m "feat: publish integrated service operations decision lab"
          git push origin HEAD:feat/p041-integrated-service-ops-v1
